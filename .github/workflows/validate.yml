name: Validate word packs

on:
  pull_request:
    paths:
      - "packs/**/*.json"
      - "examples/**/*.json"
      - "schema/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  push:
    branches:
      - main
    paths:
      - "packs/**/*.json"
      - "examples/**/*.json"
      - "schema/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate JSON word packs
        run: node scripts/validate-packs.mjs
