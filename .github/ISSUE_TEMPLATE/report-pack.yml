name: Report a word-pack problem
description: Report a mistranslation, reading error, duplicate, or source concern.
title: "[Pack error] "
labels:
  - pack-error
body:
  - type: input
    id: pack
    attributes:
      label: Word pack
      description: Enter the file path or word-pack URL.
      placeholder: packs/ko-ja/travel/example.json
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain which word is affected and what is wrong.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested correction and evidence
      description: Provide the corrected content and sources when available.
  - type: checkboxes
    id: conduct
    attributes:
      label: Confirmation
      options:
        - label: I included only information that may be shared publicly.
          required: true
