name: 새 단어팩 요청
description: 필요한 상황이나 주제의 단어팩을 제안합니다.
title: "[요청] "
labels:
  - pack-request
body:
  - type: input
    id: topic
    attributes:
      label: 상황 또는 주제
      placeholder: 일본 여행 중 식당에서 사용하는 표현
    validations:
      required: true
  - type: textarea
    id: audience
    attributes:
      label: 필요한 이유와 대상
      description: 어떤 학습자에게 언제 필요한지 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: 포함하면 좋은 단어 예시
  - type: checkboxes
    id: conduct
    attributes:
      label: 확인
      options:
        - label: 기존 단어팩과 요청을 검색했습니다.
          required: true
