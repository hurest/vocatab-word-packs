name: Request a word pack
description: Suggest a useful topic or situation for a new word pack.
title: "[Pack request] "
labels:
  - pack-request
body:
  - type: input
    id: topic
    attributes:
      label: Situation or topic
      placeholder: Expressions used at restaurants while traveling in Japan
    validations:
      required: true
  - type: textarea
    id: audience
    attributes:
      label: Audience and need
      description: Explain who needs this pack and when they would use it.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Example words to include
  - type: checkboxes
    id: conduct
    attributes:
      label: Confirmation
      options:
        - label: I searched existing packs and requests.
          required: true
